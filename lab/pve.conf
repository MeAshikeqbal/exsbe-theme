# Exsbe Lab: how to reach the Proxmox cluster (installed to ~/.config/exsbe/pve.conf).
# endpoints are tried in order; add a Tailscale name/IP here if you route the cluster over your tailnet.
endpoints = https://pve.example.lan https://192.0.2.10:8006 https://192.0.2.20:8006 https://192.0.2.30:8006
# web UI (app window, VM consoles)
web = https://pve.example.lan
# Proxmox Backup Server (read-only token from exsbe-pve-setup --pbs)
pbs = https://pbs.example.lan:8007
# home router MAC: the Lab Tailscale route is only used when the gateway is not this
home_gateway = 00:00:5e:00:53:01
# Jellyfin: API (direct, LAN) and web UI
jellyfin = http://192.0.2.104:8096
jellyfin_web = https://jellyfin.example.lan
