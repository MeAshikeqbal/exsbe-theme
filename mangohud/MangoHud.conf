# Exsbe MangoHud: compact graphite bar in the Exsbe palette. Hidden until toggled.
#   Right Shift+F12  show / hide       Right Shift+F11  move it
#   Left Shift+F1    cycle FPS cap (off, 60, 120, 144)
legacy_layout=false
horizontal
hud_compact
no_display
position=top-left
round_corners=10
background_color=1c1c1f
background_alpha=0.6
font_size=18
text_color=e6e6e8

fps
fps_color_change
fps_value=30,60
fps_color=e07a7a,e0c47a,8fc79a
frame_timing=1
frametime_color=8fa4c0

gpu_stats
gpu_temp
gpu_power
gpu_load_change
gpu_load_color=8fc79a,e0c47a,e07a7a
gpu_color=7fa8d6
vram
vram_color=b494d6

cpu_stats
cpu_temp
cpu_load_change
cpu_load_color=8fc79a,e0c47a,e07a7a
cpu_color=8fa4c0
ram
ram_color=7fc8c8
engine_color=a8a8b0

toggle_hud=Shift_R+F12
toggle_hud_position=Shift_R+F11
fps_limit_method=early
fps_limit=0,60,120,144
toggle_fps_limit=Shift_L+F1
